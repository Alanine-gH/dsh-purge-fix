# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

# ── v1.1.9 安全默认 ───────────────────────────────────────────────────────────
# 旧版在这里用 `- id: system-prompt` 覆盖宿主 system-prompt 的 config，写入
# personaSuffix: "Your working directory is {{cwd}}."。宿主 0.2.2+ 的
# deployment:persona-suffix 段只注册 provider/model，{{cwd}} 会被判为
# unknown prompt variable → 一启用插件每一轮都失败；而 Loader 对 `- id` 是
# 「整体替换 config、不做深合并」，还会把宿主其余配置清空。两条一并删除，
# 宿主 system-prompt 完全交回宿主自己管，插件不再在组装前碰它。
#
# 旧版还 insert 三个演练台服务，并在 apply() 里把 .agent-presets/redteam/
# 落到 $DSH_HOME；预设引用 dsh-purge/redteam/tools，插件一禁用引用就悬空，
# gateway 新建会话直接崩（ctx.agents.roots is not a function / 创建会话失败）。
# 现在三行默认 disabled，且 lib/redteam/index.js 在安全模式下不落预设。

- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        # 默认安全模式：apply() 只注册只读状态命令 / 工具 / HTTP 端点，
        # 不写宿主文件、不解包 app.asar、不注入提示词、不改权限、不自动重启。
        # 只有显式写成 false 才启用旧版会修改 dsh 安装文件的完整能力。
        safeMode: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: false
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: false
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: false
        hooksDenyBypass: false
        # 提示词注入开关默认关闭；安全模式下即使打开也不会写盘。
        injectEnabled: false

    # 演练台默认停用：不再往 $DSH_HOME/.agent-presets 落悬空预设。
    # 需要演练台时：去掉以下三行的 disabled，并把 safeMode 设为 false，重启宿主。
    - id: dsh-purge-redteam
      name: dsh-purge/redteam
      disabled: true

    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      disabled: true

    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
      disabled: true
